services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymapp
      POSTGRES_PASSWORD: gymapp
      POSTGRES_DB: gymapp
    ports:
      - "5432:5432"
    volumes:
      - gymapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymapp_postgres_data:
